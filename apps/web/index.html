<!doctype html>

  <head>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A demo of modern PWA capabilities." />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!--
      iOS launch screens. Without these, an installed PWA shows a blank white
      screen until first paint — there's no manifest-driven equivalent of
      Android's splash. iOS picks the matching link based on device-width,
      device-height, DPR, and orientation. PNGs are generated by
      `npm run gen:assets` from logo.svg (see pwa-assets.config.ts).

      Curated list: modern iPhones (portrait — iOS reuses portrait for
      landscape launches on iPhone) + iPads (both orientations). If you add a
      newer device, copy a line and update the dimensions from
      `appleSplashScreenSizes` in @vite-pwa/assets-generator.
    -->
    <!-- iPhone 16 Pro Max -->
    <link rel="apple-touch-startup-image" href="/apple-splash-portrait-1320x2868.png"
          media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 16 Pro -->
    <link rel="apple-touch-startup-image" href="/apple-splash-portrait-1206x2622.png"
          media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 16 Plus / 15 Pro Max / 14 Pro Max -->
    <link rel="apple-touch-startup-image" href="/apple-splash-portrait-1290x2796.png"
          media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 16 / 16e / 15 / 15 Pro / 14 Pro -->
    <link rel="apple-touch-startup-image" href="/apple-splash-portrait-1179x2556.png"

    <!-- iPhone 14 Plus / 13 Pro Max / 12 Pro Max -->

    <!-- iPhone 14 / 13 / 13 Pro / 12 / 12 Pro -->

    <!-- iPhone 13 mini / 12 mini / 11 Pro / XS / X -->

    <!-- iPhone 11 Pro Max / XS Max -->

    <!-- iPhone 11 / XR -->
    <link rel="apple-touch-startup-image" href="/apple-splash-portrait-828x1792.png"
          media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPhone 8 Plus / 7 Plus / 6s Plus / 6 Plus -->
