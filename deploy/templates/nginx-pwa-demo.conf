# nginx reverse proxy for pwa-demo
# - Terminates :80 and proxies everything to the node server on :3000.
# - WebSocket upgrade headers are required for socket.io.
# - Long timeouts so socket.io long-poll fallback doesn't get cut.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # PWA assets can be largish; allow.
    client_max_body_size 25m;

    # Service-worker scripts must never be cached by intermediaries —
    # nginx will pass through whatever the app sends, but be explicit
    # about not adding our own caching to /sw.js so updates roll out.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
