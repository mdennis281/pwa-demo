# Cloud Build pipeline: build image -> push to Artifact Registry -> deploy
# to Cloud Run. Triggered by GitHub push-to-main; also runnable manually
# via `gcloud builds submit --config=cloudbuild.yaml`.

substitutions:
  # us-central1 (Iowa) — moved from us-south1 because Cloud Run Domain
  # Mappings (needed for yesweb.app native HTTPS) aren't enabled in
  # us-south1. ~20ms additional latency from Houston is imperceptible.
  _REGION: us-central1
  _REPO: pwa-demo
  _SERVICE: pwa-demo
  _RUNTIME_SA: pwa-demo-run@yesweb-497913.iam.gserviceaccount.com
  _SQL_INSTANCE: yesweb-497913:us-central1:yesweb-db

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

steps:
  # ────────────────────────────────────────────────────────────────────
  # 1. Build image. Two tags: $SHORT_SHA (immutable, rollback-friendly)
  #    and `latest` (for casual `docker pull`). BuildKit cache mounts in
  #    the Dockerfile speed up subsequent builds.
  # ────────────────────────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # ────────────────────────────────────────────────────────────────────
  # 2. Push both tags.
  # ────────────────────────────────────────────────────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ['build']
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # ────────────────────────────────────────────────────────────────────
  # 3. Deploy to Cloud Run. Service is exposed publicly; the runtime SA
  #    holds the Cloud SQL + Secret Manager grants. min-instances=1 keeps
  #    the websocket-heavy server warm so a first user doesn't hit cold
  #    start; bump to 0 if you want pure scale-to-zero billing.
  # ────────────────────────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --min-instances=1
      - --max-instances=3
      - --timeout=3600
      - --session-affinity
      # CANONICAL_HOST is read by an Express middleware that 301-redirects any
      # non-canonical hostname (e.g. www.yesweb.app) to https://yesweb.app.
      # Drop this var or set it to "" to disable the redirect.
      # ALLOWED_HOSTS lists alternate domains served directly (NOT redirected):
      # pwa.dipduo.com is the legacy domain kept pointed at this same service so
      # users whose DNS blocks the newer yesweb.app can still reach the app.
      - --set-env-vars=NODE_ENV=production,WEB_ORIGIN=https://${_SERVICE}-356003928918.${_REGION}.run.app,CANONICAL_HOST=yesweb.app,ALLOWED_HOSTS=pwa.dipduo.com
      - --set-secrets=VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,VAPID_SUBJECT=VAPID_SUBJECT:latest,ADMIN_TOKEN=ADMIN_TOKEN:latest,DATABASE_URL=DATABASE_URL:latest,LOADTEST_TOKEN=LOADTEST_TOKEN:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 1200s
