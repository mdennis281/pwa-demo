services:
  db:
    image: postgres:16-alpine
    container_name: pwademo-db
    environment:
      POSTGRES_USER: pwademo
      POSTGRES_PASSWORD: pwademo
      POSTGRES_DB: pwademo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pwademo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
